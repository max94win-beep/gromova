name: Figma → сайт

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: figma-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Забрать тексты и фото из Figma
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: |
          if [ -z "$FIGMA_TOKEN" ] || [ -z "$FIGMA_FILE_KEY" ]; then echo "секреты FIGMA_TOKEN / FIGMA_FILE_KEY не заданы — пропуск"; exit 0; fi
          python3 figma_sync.py
      - name: Пересобрать страницы
        run: python3 build.py
      - name: Закоммитить изменения
        run: |
          git config user.name "figma-sync"
          git config user.email "figma-sync@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "изменений нет" && exit 0
          git commit -m "Figma → сайт: обновление содержимого"
          git push
